[project]
name = "marjaa"
version = "0.1.0"
description = "Marjaa (مرجع): a bilingual Arabic/English RAG assistant over UAE law that answers with exact article citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fares Abu Saleem" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
marjaa = "marjaa.cli:app"

[project.optional-dependencies]
ml = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]
ui = [
    "gradio>=6.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marjaa"]

# On Linux (Docker, CI) use CPU-only torch wheels: ~200 MB instead of ~2.5 GB of CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic text legitimately contains "ambiguous" chars

[tool.ruff.lint.per-file-ignores]
# Prompt templates read better as long natural-language lines.
"src/marjaa/generation/prompts.py" = ["E501"]
"src/marjaa/evaluation/experiments.py" = ["E501"]
"evals/runners/generate_testset.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs downloaded ML models (skipped in CI)"]
