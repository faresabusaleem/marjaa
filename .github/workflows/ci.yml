name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag (there is no `v10`), so pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Core + UI deps only: the ML extra (torch, ~2 GB) is not needed because
      # tests use the hashing embedder and the offline fake LLM.
      - name: Install
        run: uv sync --locked --extra ui

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      - name: Eval smoke test (no model downloads, no API calls)
        run: make eval-smoke

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
