name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Core + UI deps only: the ML extra (torch, ~2 GB) is not needed because
      # tests use the hashing embedder and the offline fake LLM.
      - name: Install
        run: uv sync --locked --extra ui

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      - name: Eval smoke test (no model downloads, no API calls)
        run: make eval-smoke
